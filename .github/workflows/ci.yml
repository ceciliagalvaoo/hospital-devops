name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hospital_test
          POSTGRES_USER: hospital_test
          POSTGRES_PASSWORD: hospital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital_test -d hospital_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql+psycopg://hospital_test:hospital_test@127.0.0.1:5432/hospital_test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit and integration tests with coverage
        run: >-
          pytest -v
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
