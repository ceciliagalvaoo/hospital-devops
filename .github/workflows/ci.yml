name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Release tags (one per sprint) also publish version tags of the image.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_failure:
        description: Run a deliberately failing test to verify that the Tests check fails
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only pull-request runs are cancelled by newer ones; every run on main completes, so
  # each merged commit is checked and published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: ghcr.io/ceciliagalvaoo/hospital-devops

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hospital_test
          POSTGRES_USER: hospital_test
          POSTGRES_PASSWORD: hospital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital_test -d hospital_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      CI_FORCE_FAILURE: ${{ inputs.force_failure && 'true' || 'false' }}
      TEST_DATABASE_URL: postgresql+psycopg://hospital_test:hospital_test@127.0.0.1:5432/hospital_test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit and integration tests with coverage
        run: >-
          pytest -v
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hospital_test
          POSTGRES_USER: hospital_test
          POSTGRES_PASSWORD: hospital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital_test -d hospital_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      CI_FORCE_FAILURE: ${{ inputs.force_failure && 'true' || 'false' }}
      TEST_DATABASE_URL: postgresql+psycopg://hospital_test:hospital_test@127.0.0.1:5432/hospital_test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: >-
          pytest -m e2e -v
          --screenshot only-on-failure
          --video retain-on-failure
          --tracing retain-on-failure
          --output test-results

      - name: Upload Playwright results of failed tests
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build application image
        run: docker build --tag "hospital-devops:ci-${{ github.sha }}" .

      - name: Run container smoke tests
        run: pytest -m smoke -v

  publish:
    name: Publish
    # Pushes to main (a merged pull request) and release tags only, after all required checks
    # passed on the same commit.
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, test, e2e, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history and tags, for git describe and the release-tag check.
          fetch-depth: 0

      - name: Check that a release tag points to a commit on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Compute version and image tags
        id: meta
        run: python scripts/image_metadata.py

      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application image
        run: >-
          docker build
          --build-arg APP_VERSION="$VERSION"
          --build-arg VCS_REF="$GITHUB_SHA"
          --tag "$IMAGE_NAME:build" .
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Tag and push image to GHCR
        run: |
          for tag in $TAGS; do
            docker tag "$IMAGE_NAME:build" "$IMAGE_NAME:$tag"
            docker push "$IMAGE_NAME:$tag"
          done
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Record the published image
        run: |
          first_tag="${TAGS%% *}"
          {
            echo "### Published image"
            echo
            echo "- Image: \`$IMAGE_NAME\`"
            echo "- Tags: \`$TAGS\`"
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Digest: \`$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:$first_tag")\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}

  verify-image:
    name: Verify image
    # Pulls the image that Publish pushed, without credentials, and starts it with PostgreSQL.
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_REVISION: ${{ github.sha }}
      EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Pull and check the published image
        run: |
          export PUBLISHED_IMAGE="$IMAGE_NAME:sha-${GITHUB_SHA::7}"
          echo "Checking $PUBLISHED_IMAGE"
          pytest -m published -v

