name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Release tags are handled by release.yml, which promotes the tested image without a build.
  workflow_dispatch:
    inputs:
      force_failure:
        description: Run a deliberately failing test to verify that the Tests check fails
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only pull-request runs are cancelled by newer ones; every run on main completes, so
  # each merged commit is checked and published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: ghcr.io/ceciliagalvaoo/hospital-devops

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hospital_test
          POSTGRES_USER: hospital_test
          POSTGRES_PASSWORD: hospital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital_test -d hospital_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      CI_FORCE_FAILURE: ${{ inputs.force_failure && 'true' || 'false' }}
      TEST_DATABASE_URL: postgresql+psycopg://hospital_test:hospital_test@127.0.0.1:5432/hospital_test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The coverage gate (100 % of lines and branches of app/) is configured in .coveragerc.
      - name: Run unit and integration tests with the coverage gate
        run: >-
          pytest -v
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"
          --junitxml=test-reports/tests.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-tests
          path: test-reports/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hospital_test
          POSTGRES_USER: hospital_test
          POSTGRES_PASSWORD: hospital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital_test -d hospital_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      CI_FORCE_FAILURE: ${{ inputs.force_failure && 'true' || 'false' }}
      TEST_DATABASE_URL: postgresql+psycopg://hospital_test:hospital_test@127.0.0.1:5432/hospital_test
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: >-
          pytest -m e2e -v
          --screenshot only-on-failure
          --video retain-on-failure
          --tracing retain-on-failure
          --output test-results
          --junitxml=test-reports/e2e.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-e2e
          path: test-reports/
          if-no-files-found: warn

      - name: Upload Playwright results of failed tests
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      commit_tag: ${{ steps.meta.outputs.commit_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history and tags: the version of a main build follows the latest tag.
          fetch-depth: 0

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compute version and image names (main only)
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/image_metadata.py

      # Built once: this image is smoke-tested here and pushed unchanged by Publish.
      - name: Build application image
        run: >-
          docker build
          --build-arg APP_VERSION="${VERSION:-0.0.0}"
          --build-arg VCS_REF="$GITHUB_SHA"
          --tag hospital-devops:ci .
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      # Smoke tests and the black-box journeys, against the image that Publish will push.
      - name: Run container smoke tests and black-box journeys against the built image
        run: pytest -m smoke -v --junitxml=test-reports/container.xml
        env:
          SMOKE_IMAGE: hospital-devops:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-container
          path: test-reports/
          if-no-files-found: warn

      - name: Save the tested image for publishing (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save hospital-devops:ci | gzip > tested-image.tar.gz

      - name: Upload the tested image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    # Pushes to main only (a merged pull request), after all required checks passed on the
    # same commit. Release tags are promoted by release.yml.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, e2e, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.container.outputs.version }}
    env:
      VERSION: ${{ needs.container.outputs.version }}
      TAGS: ${{ needs.container.outputs.tags }}
      COMMIT_TAG: ${{ needs.container.outputs.commit_tag }}
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v8.0.2
        with:
          name: tested-image

      - name: Load the tested image
        run: gunzip -c tested-image.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The upload name build-<commit> holds the manifest pushed by Docker. imagetools then
      # wraps it once in an index under the commit tag and the dev names; every later
      # promotion copies that index unchanged, so the digest is the same in every channel.
      - name: Push the tested image (upload name)
        run: |
          docker tag hospital-devops:ci "$IMAGE_NAME:build-$COMMIT_TAG"
          docker push "$IMAGE_NAME:build-$COMMIT_TAG"

      - name: Name the tested image with its commit tag and the dev names (no rebuild)
        run: |
          args=(--tag "$IMAGE_NAME:$COMMIT_TAG")
          for tag in $TAGS; do args+=(--tag "$IMAGE_NAME:$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE_NAME:build-$COMMIT_TAG"

      - name: Check that every name has the digest of the tested image
        run: |
          digest() { docker buildx imagetools inspect "$IMAGE_NAME:$1" | awk '/^Digest:/ {print $2}'; }
          expected="$(digest "$COMMIT_TAG")"
          for tag in $TAGS; do
            test "$(digest "$tag")" = "$expected" || { echo "::error::$tag does not match $COMMIT_TAG"; exit 1; }
          done
          {
            echo "### Published image (dev channel)"
            echo
            echo "- Image: \`$IMAGE_NAME\`"
            echo "- Names: \`$COMMIT_TAG $TAGS\`"
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Digest: $expected"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-image:
    name: Verify image
    # Pulls the image that Publish pushed, without credentials, and starts it with PostgreSQL.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_REVISION: ${{ github.sha }}
      EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Pull and check the published image
        run: |
          export PUBLISHED_IMAGE="$IMAGE_NAME:sha-${GITHUB_SHA::7}"
          echo "Checking $PUBLISHED_IMAGE"
          pytest -m published -v
