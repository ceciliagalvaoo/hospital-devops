[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not smoke and not e2e"
markers =
    smoke: container smoke tests that require Docker; run with "pytest -m smoke"
    e2e: Playwright end-to-end tests that need a browser; run with "pytest -m e2e"
    integration: tests that use the isolated PostgreSQL test database (docker compose --profile test)
